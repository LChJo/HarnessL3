name: HarnessL3 native validation

on:
  pull_request:
    paths-ignore: ['docs/**/*.md', 'README.md', 'AGENTS.md', 'web/README.md']
  push:
    branches: [main, 'codex/**']
    paths-ignore: ['docs/**/*.md', 'README.md', 'AGENTS.md', 'web/README.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Report test diagnostics
        if: always()
        run: node scripts/v1/ci-report.mjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/v1/ci-step.mjs browser-smoke
        env:
          HARNESS_TEST_BROWSER_CRLF_SEED: '1'
      - run: node scripts/v1/ci-step.mjs package-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-validation-${{ matrix.os }}
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .harness-local/validation/*.xml
            .harness-local/validation/*.json
            .harness-local/artifacts/package-smoke-*.json
            web/validation/*.png
