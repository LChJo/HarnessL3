<body>
  <header class="review-header">
    <div class="identity"><div class="brand" aria-hidden="true">L3</div><div><div class="eyebrow">HARNESSL3 · 主页设计评审</div><h1>先看全貌，再展开细节</h1></div></div>
    <div class="review-mark"><i></i><span>设计样例点亮</span><span class="divider"></span><strong>4 个候选，尚未选定</strong></div>
  </header>
  <nav class="variants" role="tablist" aria-label="切换设计方案">
    <button class="variant" role="tab" data-option="a" aria-label="方案 A 五区折叠板" aria-selected="true"><span class="variant-letter">A</span><span><strong>五区折叠板</strong><small>分类并列，在卡片里逐层打开</small></span></button>
    <button class="variant" role="tab" data-option="b" aria-label="方案 B 五根脑图" aria-selected="false"><span class="variant-letter">B</span><span><strong>五根脑图</strong><small>五个根入口，向右长出分支</small></span></button>
    <button class="variant" role="tab" data-option="c" aria-label="方案 C 嵌套空间块" aria-selected="false"><span class="variant-letter">C</span><span><strong>嵌套空间块</strong><small>打开一个区域，看里面的层次</small></span></button>
    <button class="variant" role="tab" data-option="d" aria-label="方案 D 逐层聚焦" aria-selected="false"><span class="variant-letter">D</span><span><strong>逐层聚焦</strong><small>一次只看一层，沿面包屑返回</small></span></button>
  </nav>
  <main class="workspace">
    <aside class="fixed-shell input-shell" data-fixed="input" aria-label="固定输入区域">
      <section class="shell-card"><div class="shell-label"><span>输入</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 5h16v14H4zM8 9h8M8 13h5"/></svg></div><h2>这次要解决什么</h2><p class="task-title">排查下载取消后<br>仍继续传输</p><div class="project-tag"><b>MGRP</b><span class="tiny-dot"></span><span>main</span></div><p class="shell-caption">这次任务的范围，始终留在这里。</p></section>
    </aside>
    <section class="context-area" aria-label="统一上下文区域">
      <header class="context-bar"><div class="context-title">文档与上下文<small id="variant-summary">五区折叠板</small></div><div class="view-switch" role="group" aria-label="切换查看状态"><button id="initial-state" aria-label="恢复首屏五个入口" aria-pressed="true">首屏</button><button id="expanded-state" aria-label="查看逐层展开样例" aria-pressed="false">展开样例</button></div></header>
      <div class="canvas" data-canvas aria-label="可拖动和缩放的上下文画布" tabindex="0">
        <div class="canvas-status"><i></i><span id="canvas-status">五类入口 · 点击展开</span></div>
        <div class="world" data-world></div>
        <div class="canvas-hint"><svg width="12" height="12" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.4" fill="none"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg><span>拖动画布 · 滚轮缩放</span></div>
        <div class="canvas-controls" aria-label="画布控制"><button id="zoom-out" aria-label="缩小画布"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14"/></svg></button><output id="zoom-label" aria-live="off">100%</output><button id="zoom-in" aria-label="放大画布"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M12 5v14"/></svg></button><span class="control-sep"></span><button id="fit" aria-label="适配当前画布内容"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 4H4v5M15 4h5v5M4 15v5h5M15 20h5v-5"/></svg></button><button id="reset-camera" aria-label="回到默认画布视角"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg></button></div>
      </div>
      <footer class="context-footer"><div class="state-legend"><span><i class="lit-dot"></i>样例命中</span><span><i class="quiet-dot"></i>无点亮记录</span></div><span class="projection-note">五类看同一份上下文 · 命中不代表整类已读</span></footer>
    </section>
    <aside class="fixed-shell output-shell" data-fixed="output" aria-label="固定输出区域">
      <section class="shell-card"><div class="shell-label"><span>输出</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 5h16v14H4zM8 12h9M14 9l3 3-3 3"/></svg></div><h2>本次上下文包</h2><div class="package-art" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.2"><path d="m14 19 18-9 18 9v25L32 54 14 44z"/><path d="m14 19 18 10 18-10M32 29v25M23 15l18 10v9"/><path d="m39 43 4 4 8-9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="package-status"><i></i><span>样例内容已汇总</span></div><p class="package-copy">从五类入口，查看这次任务点亮的内容与依据。</p><button class="package-button" id="package-summary" aria-label="查看设计样例上下文包摘要"><span>查看包摘要</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 12h15M14 7l5 5-5 5"/></svg></button></section>
    </aside>
  </main>
  <dialog class="detail-dialog" id="detail-dialog" aria-label="样例内容详情"><div class="dialog-head"><span id="dialog-kicker">样例内容</span><button id="close-dialog" aria-label="关闭内容详情"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="dialog-body" id="dialog-body"></div></dialog>
  <script>
    'use strict';
    // Isolated design data: no API calls, model writes, or real agent activity.
    const categories = [
      {id:'objects',name:'对象',description:'项目由哪些部分组成',modules:[
        {id:'execution',name:'任务执行',leaves:[
          {id:'task',name:'TaskManager',lit:true,description:'任务执行入口。这个样例将它列为取消请求的检查起点。'},
          {id:'scheduler',name:'TaskScheduler',lit:true,description:'任务调度状态。这个样例关注取消后仍在推进的任务。'},
          {id:'transfer',name:'传输协调',lit:true,description:'资源传输与发布的协调范围。'},
          {id:'artifact',name:'产物持久化',lit:false,description:'仍可浏览，当前样例没有这项点亮记录。'}]},
        {id:'network',name:'网络与平台后端',leaves:[{id:'manager',name:'NetworkManager',lit:true,description:'网络请求生命周期，是取消排查的相关入口。'},{id:'backend',name:'平台后端接口',lit:false,description:'当前样例尚未点亮这个细项。'}]},
        {id:'business',name:'业务编排',leaves:[{id:'download',name:'DownloadManager',lit:false,description:'业务层入口，保留在分类中供继续定位。'}]}]},
      {id:'relations',name:'关系',description:'这些部分如何协作',modules:[
        {id:'execution-links',name:'执行协作',leaves:[{id:'task-scheduler',name:'TaskManager 调用 TaskScheduler',lit:true,description:'样例中的执行协作关系。关系点亮不表示端点的所有内容均已返回。'},{id:'task-transfer',name:'任务与传输协调',lit:true,description:'任务执行与传输协调之间的关联。'},{id:'scheduler-store',name:'调度与产物发布',lit:false,description:'当前样例没有这条关系的点亮记录。'}]},
        {id:'network-links',name:'网络协作',leaves:[{id:'backend-use',name:'网络管理使用平台后端',lit:false,description:'可继续查看的关联，当前样例未点亮。'}]}]},
      {id:'sources',name:'来源',description:'这些信息从哪里来',modules:[
        {id:'code',name:'源码',leaves:[{id:'execution-code',name:'任务执行源码',lit:true,description:'任务执行相关说明所引用的源码来源。'},{id:'network-code',name:'网络管理源码',lit:true,description:'网络请求相关说明所引用的源码来源。'},{id:'platform-code',name:'平台后端源码',lit:false,description:'当前样例未点亮的源码范围。'}]},
        {id:'human',name:'人工维护',leaves:[{id:'module-notes',name:'模块职责说明',lit:true,description:'人工维护的职责说明，与源码事实分别表达。'},{id:'project-rules',name:'项目约定',lit:false,description:'当前样例没有这项说明的点亮记录。'}]},
        {id:'inference',name:'AI 推断',leaves:[{id:'cancel-inference',name:'取消信号传播线索',lit:false,note:'待核验',description:'推断示例，保留待核验状态，不作为已证实的根因。'}]}]},
      {id:'evidence',name:'证据',description:'回到具体依据核对',modules:[
        {id:'execution-evidence',name:'执行文件片段',leaves:[{id:'task-header',name:'task_manager.h 片段',lit:true,description:'设计稿中的执行入口证据示例，不在此页实际读取文件。'},{id:'scheduler-header',name:'task_scheduler.h 片段',lit:true,description:'设计稿中的调度状态证据示例。'},{id:'artifact-header',name:'产物存储片段',lit:false,description:'当前样例尚未点亮的文件依据。'}]},
        {id:'network-evidence',name:'网络文件片段',leaves:[{id:'network-impl',name:'network_manager.cpp 片段',lit:true,description:'设计稿中的网络管理依据示例。'},{id:'backend-header',name:'i_network_backend.h 片段',lit:false,description:'当前样例没有点亮的接口依据。'}]}]},
      {id:'versions',name:'版本',description:'这次上下文对应哪一版',modules:[
        {id:'model-version',name:'模型',leaves:[{id:'current-model',name:'本次模型快照',lit:true,description:'本次设计样例绑定的模型快照。'},{id:'older-model',name:'上一次模型快照',lit:false,description:'历史版本示例，未计入本次点亮范围。'}]},
        {id:'source-version',name:'源码',leaves:[{id:'current-source',name:'所引源码状态',lit:true,description:'与本次引用关联的源码状态，不代表整个项目已完成语义核验。'},{id:'other-source',name:'其他源码状态',lit:false,description:'不属于本次样例上下文的源码状态。'}]},
        {id:'worktree-version',name:'工作区',leaves:[{id:'current-worktree',name:'main · 本地工作区',lit:true,description:'本次任务所在的样例工作区。'},{id:'other-worktree',name:'其他并行工作区',lit:false,description:'另一个工作区的状态，不混入当前任务。'}]}]}
    ];
    const names={a:'五区折叠板',b:'五根脑图',c:'嵌套空间块',d:'逐层聚焦'};
    const labels={a:'分类并列 · 在卡片里展开',b:'五个根入口 · 向右展开分支',c:'区域里有区域 · 逐层打开',d:'一次看一层 · 沿面包屑返回'};
    const chevron='<svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m9 5 7 7-7 7"/></svg>';
    const leafIcon='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 3h7l4 4v14H7zM14 3v5h4M10 12h5M10 16h5"/></svg>';
    const arrowLeft='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 12H4M10 6l-6 6 6 6"/></svg>';
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const hitCount=item=>item.leaves?item.leaves.filter(x=>x.lit).length:item.modules.reduce((n,m)=>n+hitCount(m),0);
    const canvas=document.querySelector('[data-canvas]'),world=document.querySelector('[data-world]');
    const params=new URLSearchParams(location.search);
    let variant=['a','b','c','d'].includes(params.get('variant'))?params.get('variant'):'a';
    let openedCategories=new Set(),openedModules=new Set(),focusCategory=null,focusModule=null,isExample=false;
    let camera={x:0,y:0,scale:1};
    let initialCamera={...camera};
    const moduleKey=(category,module)=>category.id+'/'+module.id;
    function countBadge(item){return '<span class="category-count">'+hitCount(item)+' 项命中</span>'}
    function categoryButton(category,index,opened){return '<button class="category-toggle" data-toggle-category="'+category.id+'" aria-expanded="'+opened+'" aria-label="'+(opened?'收起':'展开')+category.name+'"><span class="category-topline"><span class="category-number">0'+(index+1)+'</span>'+countBadge(category)+'</span><span class="category-name">'+category.name+'</span><span class="category-description">'+category.description+'</span>'+chevron+'</button>'}
    function leafButton(category,module,leaf){return '<button class="leaf '+(leaf.lit?'is-lit':'is-idle')+'" data-depth="3" data-leaf="'+category.id+'/'+module.id+'/'+leaf.id+'" aria-label="查看'+esc(leaf.name)+'，'+(leaf.lit?'样例命中':'无点亮记录')+'"><i class="'+(leaf.lit?'lit-dot':'quiet-dot')+'"></i><span class="leaf-text">'+esc(leaf.name)+'</span><span class="leaf-state">'+(leaf.note|| (leaf.lit?'已点亮':'未点亮'))+'</span>'+leafIcon+'</button>'}
    function moduleBlock(category,module,tree=false){const opened=openedModules.has(moduleKey(category,module));const count=hitCount(module);return '<div class="module '+(tree?'tree-module ':'')+(opened?'is-open ':'')+(count?'':'is-idle')+'" data-depth="2" data-module="'+module.id+'"><button class="module-toggle" data-toggle-module="'+moduleKey(category,module)+'" aria-expanded="'+opened+'" aria-label="'+(opened?'收起':'展开')+module.name+'细项">'+chevron+'<span class="module-title">'+module.name+'</span><span class="count">'+(count?count+' 项':'—')+'</span></button>'+(opened?'<div class="leaf-list">'+module.leaves.map(l=>leafButton(category,module,l)).join('')+'</div>':'')+'</div>'}
    function renderBoard(){return '<div class="board">'+categories.map((c,i)=>{const o=openedCategories.has(c.id);return '<article class="category '+(o?'is-open':'')+'" data-category="'+c.id+'" data-depth="1">'+categoryButton(c,i,o)+(o?'<div class="modules">'+c.modules.map(m=>moduleBlock(c,m)).join('')+'</div><p class="root-open-note">命中仅聚合子项，不表示整类已读</p>':'')+'</article>'}).join('')+'</div>'}
    function renderMindmap(){return '<div class="mindmap">'+categories.map((c,i)=>{const o=openedCategories.has(c.id);return '<article class="category mindmap-root '+(o?'is-open':'')+'" data-category="'+c.id+'" data-depth="1">'+categoryButton(c,i,o)+(o?'<div class="tree-modules">'+c.modules.map(m=>moduleBlock(c,m,true)).join('')+'</div>':'')+'</article>'}).join('')+'</div>'}
    function renderSpaces(){return '<div class="spaces">'+categories.map((c,i)=>{const o=openedCategories.has(c.id);return '<article class="category '+(o?'is-open':'')+'" data-category="'+c.id+'" data-depth="1">'+categoryButton(c,i,o)+(o?'<div class="modules">'+c.modules.map(m=>moduleBlock(c,m)).join('')+'</div>':'')+'</article>'}).join('')+'</div>'}
    function renderFocus(){
      if(!focusCategory)return '<div class="focus-space"><p class="focus-intro">从一类信息开始，下一层只在进入后出现。</p><div class="focus-list">'+categories.map((c,i)=>'<article class="category" data-category="'+c.id+'" data-depth="1"><button class="category-toggle" data-focus-category="'+c.id+'" aria-label="进入'+c.name+'分类" aria-expanded="false"><span class="category-number">0'+(i+1)+'</span><span class="category-name">'+c.name+'</span><span class="category-description">'+c.description+'</span>'+countBadge(c)+chevron+'</button></article>').join('')+'</div></div>';
      const c=categories.find(x=>x.id===focusCategory),m=c.modules.find(x=>x.id===focusModule);
      let crumbs='<nav class="focus-crumbs" aria-label="当前展开层级"><button data-focus-back="root" aria-label="返回全部五类入口">五类上下文</button>'+chevron+(m?'<button data-focus-back="category" aria-label="返回'+c.name+'模块层">'+c.name+'</button>'+chevron+'<span>'+m.name+'</span>':'<span>'+c.name+'</span>')+'</nav>';
      const heading='<div class="focus-heading"><div><h2>'+(m?m.name:c.name)+'</h2><p>'+(m?'这次任务命中的细项，保留在原来的分类下。':c.description)+'</p></div><button class="focus-back" data-focus-back="'+(m?'category':'root')+'" aria-label="返回上一层">'+arrowLeft+'返回上一层</button></div>';
      const contents=m?'<div class="focus-leaves" data-depth="2" data-module="'+m.id+'">'+m.leaves.map(l=>leafButton(c,m,l)).join('')+'</div>':'<div class="focus-grid">'+c.modules.map(n=>'<div class="module '+(hitCount(n)?'':'is-idle')+'" data-depth="2" data-module="'+n.id+'"><button class="module-toggle" data-focus-module="'+moduleKey(c,n)+'" aria-expanded="false" aria-label="进入'+n.name+'细项">'+chevron+'<span class="module-title">'+n.name+'</span><span class="count">'+(hitCount(n)?hitCount(n)+' 项命中':'无点亮')+'</span></button></div>').join('')+'</div>';
      return '<div class="focus-space" data-category="'+c.id+'" data-depth="1">'+crumbs+heading+contents+'</div>';
    }
    function render(){
      document.body.dataset.variant=variant;
      document.querySelectorAll('[data-option]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.option===variant));b.tabIndex=b.dataset.option===variant?0:-1});
      document.getElementById('variant-summary').textContent=names[variant];
      const hasExpansion=openedCategories.size>0||!!focusCategory;
      document.getElementById('initial-state').setAttribute('aria-pressed',String(!hasExpansion));
      document.getElementById('expanded-state').setAttribute('aria-pressed',String(isExample));
      document.getElementById('canvas-status').textContent=hasExpansion?(variant==='d'?'沿面包屑逐层返回':'点击标题可收起 · 继续展开模块'):'五类入口 · 点击展开';
      world.innerHTML=variant==='a'?renderBoard():variant==='b'?renderMindmap():variant==='c'?renderSpaces():renderFocus();
      updateUrl();
    }
    function updateUrl(){const p=new URLSearchParams();p.set('variant',variant);if(isExample)p.set('state','expanded');history.replaceState(null,'',location.pathname+'?'+p.toString());}
    function applyCamera(){world.style.transform='translate('+camera.x+'px,'+camera.y+'px) scale('+camera.scale+')';document.getElementById('zoom-label').textContent=Math.round(camera.scale*100)+'%';canvas.dataset.zoom=camera.scale.toFixed(3);canvas.dataset.panX=camera.x.toFixed(1);canvas.dataset.panY=camera.y.toFixed(1)}
    function frameContents(storeDefault=false,readable=false){const cw=canvas.clientWidth,ch=canvas.clientHeight,ww=world.offsetWidth,wh=world.offsetHeight;const sideBranch=readable&&variant==='b'&&cw<600;const scale=sideBranch?1:Math.min(1,Math.max(.35,(cw-34)/ww),readable?1:Math.max(.35,(ch-74)/wh));camera={x:sideBranch?-290:(cw-ww*scale)/2,y:Math.max(40,(ch-wh*scale)/2-4),scale};if(storeDefault)initialCamera={...camera};applyCamera()}
    function setInitial(){openedCategories.clear();openedModules.clear();focusCategory=null;focusModule=null;isExample=false;render();requestAnimationFrame(()=>frameContents(true));}
    function setExample(){openedCategories=new Set(['objects']);openedModules=new Set(['objects/execution']);focusCategory=variant==='d'?'objects':null;focusModule=variant==='d'?'execution':null;isExample=true;render();requestAnimationFrame(()=>frameContents(true,true));}
    function changeVariant(next){if(variant===next)return;const useExample=isExample;variant=next;if(useExample)setExample();else setInitial();}
    function zoomAt(next,x,y){const scale=Math.min(1.8,Math.max(.35,next)),ratio=scale/camera.scale;camera.x=x-(x-camera.x)*ratio;camera.y=y-(y-camera.y)*ratio;camera.scale=scale;applyCamera();}
    function buttonZoom(factor){zoomAt(camera.scale*factor,canvas.clientWidth/2,canvas.clientHeight/2)}
    document.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>changeVariant(b.dataset.option)));
    document.querySelector('.variants').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const opts=['a','b','c','d'];const index=opts.indexOf(variant);const next=e.key==='Home'?'a':e.key==='End'?'d':opts[(index+(e.key==='ArrowRight'?1:3))%4];changeVariant(next);document.querySelector('[data-option="'+next+'"]').focus()});
    document.getElementById('initial-state').addEventListener('click',setInitial);
    document.getElementById('expanded-state').addEventListener('click',setExample);
    document.getElementById('zoom-in').addEventListener('click',()=>buttonZoom(1.16));
    document.getElementById('zoom-out').addEventListener('click',()=>buttonZoom(1/1.16));
    document.getElementById('fit').addEventListener('click',()=>frameContents(false));
    document.getElementById('reset-camera').addEventListener('click',()=>{camera={...initialCamera};applyCamera()});
    world.addEventListener('click',e=>{
      if(dragSuppressed){e.preventDefault();return}
      const b=e.target.closest('button');if(!b)return;
      if(b.dataset.toggleCategory){const id=b.dataset.toggleCategory;if(openedCategories.has(id)){openedCategories.delete(id);for(const key of openedModules)if(key.startsWith(id+'/'))openedModules.delete(key)}else openedCategories.add(id);isExample=false;render();}
      else if(b.dataset.toggleModule){const key=b.dataset.toggleModule;openedModules.has(key)?openedModules.delete(key):openedModules.add(key);isExample=false;render();}
      else if(b.dataset.focusCategory){focusCategory=b.dataset.focusCategory;focusModule=null;isExample=false;render();requestAnimationFrame(()=>frameContents(false,true));}
      else if(b.dataset.focusModule){focusModule=b.dataset.focusModule.split('/')[1];isExample=false;render();requestAnimationFrame(()=>frameContents(false,true));}
      else if(b.dataset.focusBack){if(b.dataset.focusBack==='root'){focusCategory=null;focusModule=null}else focusModule=null;isExample=false;render();requestAnimationFrame(()=>frameContents(false,!(!focusCategory)));}
      else if(b.dataset.leaf){const [cid,mid,lid]=b.dataset.leaf.split('/');const c=categories.find(c=>c.id===cid),m=c.modules.find(m=>m.id===mid),l=m.leaves.find(l=>l.id===lid);showDetail(c,m,l)}
    });
    const dialog=document.getElementById('detail-dialog');
    function showDetail(c,m,l){document.getElementById('dialog-kicker').textContent='样例细项';document.getElementById('dialog-body').innerHTML='<div class="dialog-breadcrumb">'+c.name+' / '+m.name+'</div><h2>'+esc(l.name)+'</h2><p>'+esc(l.description)+'</p><div class="dialog-status"><i class="'+(l.lit?'lit-dot':'quiet-dot')+'"></i>'+(l.note?'待核验 · ': '')+(l.lit?'本任务样例命中':'当前样例无点亮记录')+'</div><p class="review-message">设计样例，不是真实 agent 读取记录。</p>';dialog.showModal();}
    document.getElementById('close-dialog').addEventListener('click',()=>dialog.close());
    dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
    document.getElementById('package-summary').addEventListener('click',()=>{document.getElementById('dialog-kicker').textContent='上下文包 · 设计样例';document.getElementById('dialog-body').innerHTML='<h2>排查下载取消后<br>仍继续传输</h2><p>同一份任务上下文，可从对象、关系、来源、证据和版本五个角度逐层查看。</p>'+categories.map(c=>'<div class="dialog-fact"><span>'+c.name+'</span><strong>'+hitCount(c)+' 项样例命中</strong></div>').join('')+'<p class="review-message">各类可能引用同一内容，命中数不累加为独立读取量。此页不连接真实任务。</p>';dialog.showModal()});
    let pointers=new Map(),dragStart=null,pinchStart=null,dragSuppressed=false;
    function pinchMetrics(){const values=[...pointers.values()];return {distance:Math.hypot(values[0].x-values[1].x,values[0].y-values[1].y),x:(values[0].x+values[1].x)/2,y:(values[0].y+values[1].y)/2}}
    canvas.addEventListener('pointerdown',e=>{if(e.target.closest('button')||e.button!==0)return;canvas.setPointerCapture(e.pointerId);const r=canvas.getBoundingClientRect();pointers.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});dragSuppressed=false;if(pointers.size===1){dragStart={x:e.clientX,y:e.clientY,camera:{...camera}};canvas.classList.add('dragging')}else if(pointers.size===2){pinchStart={...pinchMetrics(),camera:{...camera}};dragStart=null;dragSuppressed=true}});
    canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const r=canvas.getBoundingClientRect();pointers.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});if(pointers.size===2&&pinchStart){const p=pinchMetrics(),scale=Math.min(1.8,Math.max(.35,pinchStart.camera.scale*p.distance/pinchStart.distance)),ratio=scale/pinchStart.camera.scale;camera={x:p.x-(pinchStart.x-pinchStart.camera.x)*ratio,y:p.y-(pinchStart.y-pinchStart.camera.y)*ratio,scale};dragSuppressed=true;applyCamera()}else if(dragStart){const dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y;if(Math.hypot(dx,dy)>4)dragSuppressed=true;camera.x=dragStart.camera.x+dx;camera.y=dragStart.camera.y+dy;applyCamera()}});
    function releasePointer(e){pointers.delete(e.pointerId);if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);if(pointers.size<2)pinchStart=null;if(!pointers.size){dragStart=null;canvas.classList.remove('dragging');setTimeout(()=>{dragSuppressed=false},0)}}
    canvas.addEventListener('pointerup',releasePointer);canvas.addEventListener('pointercancel',releasePointer);
    canvas.addEventListener('wheel',e=>{if(e.target.closest('.canvas-controls'))return;e.preventDefault();const r=canvas.getBoundingClientRect();zoomAt(camera.scale*Math.exp(-e.deltaY*.0013),e.clientX-r.left,e.clientY-r.top)},{passive:false});
    canvas.addEventListener('keydown',e=>{if(e.target!==canvas)return;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','=','-','0'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')camera.x+=45;if(e.key==='ArrowRight')camera.x-=45;if(e.key==='ArrowUp')camera.y+=45;if(e.key==='ArrowDown')camera.y-=45;if(e.key==='+'||e.key==='=')buttonZoom(1.1);else if(e.key==='-')buttonZoom(1/1.1);else if(e.key==='0')frameContents(false);else applyCamera()});
    let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>frameContents(true),120)});
    if(params.get('state')==='expanded')setExample();else setInitial();
  </script>
</body>
</html>
