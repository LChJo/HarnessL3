:0}.demo-controls{margin-top:24px;gap:8px}.demo-controls .demo-disclaimer{font-size:10px}.demo-controls select{font-size:11px;flex:1;min-width:0}.demo-controls .demo-next{font-size:11px;padding:6px 8px}.version-notice{padding:10px 16px;font-size:11px}.drawer{padding:20px 22px}.drawer h2{font-size:23px}}

<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="返回原型"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Harness<small>L3</small></a>
    <nav class="topnav" aria-label="主导航"><span class="active" aria-current="page">任务上下文</span><a href="/">模型与证据 ↗</a></nav>
    <span class="concept-tag">交互设计稿 · 模拟任务</span>
  </header>
  <main class="workspace">
    <div class="scope-row"><strong>MGRP</strong><span>/</span><span class="branch"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="4" cy="3" r="1.5"/><circle cx="4" cy="13" r="1.5"/><circle cx="12" cy="3" r="1.5"/><path d="M4 4.5v7M12 4.5v2A4 4 0 0 1 8 10H4"/></svg><span id="branchName">main</span></span><span class="source" id="sourceScope">正在确认模型来源</span></div>
    <div class="task-line"><div><div class="task-label">当前任务 · 设计示例</div><h1>排查下载取消后仍继续传输</h1></div><div class="agent"><span class="agent-icon">A</span>Agent · 示例会话</div></div>
    <div class="task-meta" aria-live="polite"><span id="summary"><i class="signal"></i>正在加载项目模块</span><span id="snapshotLabel">上下文快照</span></div>
    <section class="map-card" aria-label="任务上下文地图">
      <div class="map-top"><div id="mapHeading" class="map-title">项目模块</div><span class="view-hint">只展开你关心的部分</span><button class="text-button records-button" id="recordsButton"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><path d="M4 4h8M4 8h8M4 12h5"/></svg>提供记录</button></div>
      <div id="notice" class="version-notice" hidden></div>
      <div class="map-stage" id="mapStage"><div class="loading">从 LikeC4 主模型读取模块层级…</div></div>
      <div class="map-bottom"><span class="legend-item"><i class="legend-dot lit"></i>已提供</span><span class="legend-item"><i class="legend-dot pending"></i>候选待提供</span><span class="legend-item"><i class="legend-dot"></i>无提供记录</span><span class="map-instruction">点击模块展开；展开不会提供上下文</span></div>
    </section>
    <div class="latest"><span class="latest-mark"></span><span class="time" id="latestTime">示例 14:32</span><span id="latestText">等待模型加载</span><button id="packetButton">返回内容预览 ↗</button></div>
    <aside class="demo-controls" aria-label="设计演示控制">
      <label for="scenario">演示状态</label>
      <select id="scenario"><option value="empty">开始任务 · 尚无记录</option><option value="selected">CLI 选好候选 · 尚未提供</option><option value="provided" selected>CLI 已提供 · 点亮 3 项</option><option value="expanded">按需追加 · 再点亮 1 项</option><option value="failed">提供失败 · 保留候选</option><option value="stale">模型变化 · 旧快照需更新</option></select>
      <button class="demo-next" id="nextScenario">演示下一步 →</button>
      <span class="demo-disclaimer">层级来自真实主模型；任务、点亮与提供记录为模拟，不会发送给 agent。</span>
    </aside>
  </main>
  <div class="shade" id="drawerShade" hidden><section class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" tabindex="-1"></section></div>
  <script>
    const $=id=>document.getElementById(id);
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const meta=(node,key)=>Array.isArray(node.metadata?.[key])?node.metadata[key].join(', '):node.metadata?.[key]??'';
    let snapshot, nodes=[], byId=new Map(), focus='mgrp', scenario='provided';
    const mainIds=['mgrp.business.download','mgrp.execution.task','mgrp.execution.scheduler'];
    const addedId='mgrp.network.manager';
    const scenarios=['empty','selected','provided','expanded','failed','stale'];
    let opener=null;
    const children=id=>nodes.filter(n=>n.id.substring(0,n.id.lastIndexOf('.'))===id);
    const candidates=()=>scenario==='empty'?[]:[...mainIds,...(scenario==='expanded'?[addedId]:[])].filter(id=>byId.has(id));
    const provided=()=>['provided','expanded','stale'].includes(scenario)?candidates():[];
    const countIn=(ids,id)=>ids.filter(key=>key===id||key.startsWith(id+'.')).length;
    const areas=()=>new Set(provided().map(id=>id.split('.').slice(0,2).join('.'))).size;
    const revision=()=>snapshot?.revision?.slice(0,8)??'未知';
    function statusFor(node){
      const delivered=provided(), selected=candidates(), exact=delivered.includes(node.id), count=countIn(delivered,node.id), pending=countIn(selected,node.id);
      if(exact)return {className:'provided',note:scenario==='stale'?'旧快照 · 需更新':'本任务已提供',label:scenario==='stale'?'旧快照已提供，需更新':'本任务已提供'};
      if(count)return {className:'contains',note:`含 ${count} 项已提供${scenario==='stale'?' · 旧':''}`,label:`含 ${count} 项已提供，非本模块全部内容`};
      if(pending)return {className:'pending',note:scenario==='failed'?`${pending} 项候选 · 提供失败`:`${pending} 项候选待提供`,label:'候选待提供'};
      const size=children(node.id).length;
      return {className:'',note:size?`${size} 个子模块`:'查看上下文',label:'本任务无提供记录'};
    }
    function render(){
      if(!snapshot)return;
      const num=provided().length;
      $('summary').innerHTML=`<i class="signal" style="background:${num?'var(--green)':'#a9b5ac'}"></i>${num?`已提供 ${num} 项上下文 · 涉及 ${areas()} 个区域`:scenario==='empty'?'尚无上下文提供记录':`${candidates().length} 项候选 · 尚未成功提供`}`;
      $('snapshotLabel').textContent=scenario==='stale'?'示例：提供快照较旧':'按需提供';
      $('snapshotLabel').title=`模型版本 ${snapshot.revision}`;
      $('mapHeading').innerHTML=focus==='mgrp'?'项目模块':`<div class="crumb"><button id="backToAll">全部模块</button><span aria-hidden="true">/</span><span>${esc(byId.get(focus)?.title)}</span></div>`;
      $('backToAll')?.addEventListener('click',()=>setFocus('mgrp'));
      const notice=$('notice');
      notice.hidden=!['failed','stale'].includes(scenario)||snapshot.modelStatus!=='valid';
      notice.textContent=scenario==='failed'?'演示：本次提供失败。候选仍保留，没有产生成功点亮记录。':'演示：模型已变化。保留旧提供记录，并提示需要更新上下文。';
      if(snapshot.modelStatus!=='valid'){notice.hidden=false;notice.textContent='主模型当前不可用；以下为最近有效层级，交互状态仍为设计演示。'}
      const current=byId.get(focus), peers=children(focus), left=[],right=[];
      peers.forEach((n,i)=>(i<Math.ceil(peers.length/2)?left:right).push(n));
      const positions=[];
      for(const [side,list] of [['left',left],['right',right]])list.forEach((node,i)=>{
        const gap=peers.length>7?78:100;
        const top=250-(list.length-1)*gap/2-32;
        positions.push({node,side,x:side==='left'?6.2:70.8,y:top+i*gap});
      });
      let paths='',cards='';
      positions.forEach(({node,side,x,y})=>{
        const status=statusFor(node), hasChildren=children(node.id).length>0;
        const from=side==='left'?466:634,to=side==='left'?321:779,mid=(from+to)/2;
        paths+=`<path class="${status.className==='provided'||status.className==='contains'?'lit':status.className==='pending'?'pending':''}" d="M ${from} 250 C ${mid} 250 ${mid} ${y+32} ${to} ${y+32}"/>`;
        cards+=`<div class="map-node ${status.className} ${hasChildren?'has-info':''}" style="left:${x}%;top:${y}px" data-node="${esc(node.id)}"><button class="node-main" data-open="${esc(node.id)}" aria-label="${esc(node.title)}，${esc(status.label)}，${hasChildren?'展开子模块':'查看详情'}"${hasChildren?' aria-expanded="false"':''}><span class="node-indicator" aria-hidden="true"></span><span class="node-copy"><span class="node-title">${esc(node.title)}</span><span class="node-note">${esc(status.note)}</span></span>${hasChildren?'<span class="node-arrow" aria-hidden="true">›</span>':''}</button>${hasChildren?`<button class="node-info" data-detail="${esc(node.id)}" aria-label="${esc(node.title)}详情">ⓘ</button>`:''}</div>`;
      });
      const rootCount=countIn(provided(),focus);
      $('mapStage').innerHTML=`<svg class="connections" viewBox="0 0 1100 500" preserveAspectRatio="none" aria-hidden="true">${paths}</svg><button class="root-node" id="rootNode" aria-label="${focus==='mgrp'?'项目上下文详情':'收起当前分支，返回全部模块'}"><strong>${esc(current?.title??'MGRP')}</strong><small>${rootCount?`含 ${rootCount} 项已提供`:'本次任务上下文'}</small>${focus!=='mgrp'?'<span class="back-label">收起分支 ↑</span>':''}</button>${cards}`;
      document.querySelectorAll('[data-open]').forEach(button=>button.addEventListener('click',()=>{
        const id=button.dataset.open;
        if(children(id).length)setFocus(id);else openDetail(id);
      }));
      document.querySelectorAll('[data-detail]').forEach(button=>button.addEventListener('click',()=>openDetail(button.dataset.detail)));
      $('rootNode').addEventListener('click',()=>focus==='mgrp'?openDetail('mgrp'):setFocus('mgrp'));
      const texts={empty:'新任务已建立，等待 CLI 选择所需上下文。',selected:'CLI 已选好 3 项候选；返回成功后才会点亮。',provided:'CLI 已提供下载编排、任务门面与调度状态的上下文。',expanded:'发现网络边界，CLI 按需追加了网络管理上下文。',failed:'CLI 返回失败，保留候选，等待重试。',stale:'原有提供记录保留；当前模型变化后需要重新提供。'};
      $('latestText').textContent=texts[scenario];
      $('latestTime').textContent=scenario==='expanded'?'示例 14:35':'示例 14:32';
      $('nextScenario').disabled=scenario==='stale';
    }
    function setFocus(id){focus=id;render();$('rootNode')?.focus({preventScroll:true});}
    function showDrawer(title,html){
      if($('drawerShade').hidden)opener=document.activeElement;
      $('drawer').innerHTML=`<div class="drawer-head"><span>设计演示</span><button class="close" id="closeDrawer" aria-label="关闭详情">×</button></div><h2 id="drawerTitle">${esc(title)}</h2>${html}`;
      $('drawerShade').hidden=false;
      document.body.style.overflow='hidden';
      $('closeDrawer').addEventListener('click',closeDrawer);
      $('drawer').focus();
    }
    function closeDrawer(){ $('drawerShade').hidden=true;document.body.style.overflow='';opener?.isConnected&&opener.focus({preventScroll:true}); }
    function openDetail(id){
      const n=byId.get(id),s=statusFor(n),exact=provided().includes(id),count=countIn(provided(),id);
      const statement=exact?'此模块的上下文出现在模拟 CLI 成功返回记录中。':count?'只有所列子项有提供记录，不能将整个父模块视为已提供。':'当前任务没有这项上下文的成功提供记录；其他工具是否读取仍需日志证据。';
      showDrawer(n.title,`<span class="status ${exact?'lit':''}">${esc(s.label)}</span><p class="explanation">${statement}</p><h3>模块职责 · 来自主模型</h3><p>${esc(n.description)}</p><h3>可追溯信息</h3><dl class="detail-pairs"><dt>对象</dt><dd><code>${esc(n.id)}</code></dd><dt>来源</dt><dd>${esc(meta(n,'source'))}</dd><dt>证据引用</dt><dd><code>${esc(meta(n,'evidence'))}</code></dd><dt>源码位置</dt><dd><code>${esc(meta(n,'path'))}</code></dd><dt>模型版本</dt><dd><code>${revision()}${scenario==='stale'?' · 演示旧快照状态':''}</code></dd><dt>读取轨迹</dt><dd>未接入此设计稿 · 未知</dd></dl>${count?`<h3>本分支已提供项</h3><p>${provided().filter(key=>key===id||key.startsWith(id+'.')).map(key=>esc(byId.get(key).title)).join('、')}</p>`:''}<button class="block-button" id="detailPacket">查看返回内容预览（演示）</button><div class="boundary">展开只是浏览。已提供说明有成功返回记录，不能证明模型已经理解，也不覆盖未采集的其他读取。</div>`);
      $('detailPacket').addEventListener('click',openPacket);
    }
    function packetText(){
      const list=provided();
      if(!list.length)return '本次没有成功提供的上下文。\n候选选择不会产生成功返回记录。';
      return `# 任务上下文包（演示，无真实发送）\n任务: demo-cancel-download\n来源 worktree: ${snapshot.runtime?.sourceRoot??'未知'}\n模型版本: ${snapshot.revision}\n快照状态: ${scenario==='stale'?'模拟旧快照，需更新':'当前模型的设计预览'}\n选择口径: 仅精确对象，不自动包含子树\n\n`+list.map(id=>{
        const n=byId.get(id),parent=byId.get(id.substring(0,id.lastIndexOf('.')));
        const boundary=(snapshot.relationships??[]).filter(r=>(r.source===id||r.target===id)&&!(list.includes(r.source)&&list.includes(r.target))).map(r=>`${r.kind}: ${r.source} → ${r.target}`);
        return `## ${n.title}\n对象: ${n.id}\n位置: ${parent?.title??''} / ${n.title}\n职责: ${n.description}\n来源: ${meta(n,'source')}\n状态: ${meta(n,'status')}\n证据引用: ${meta(n,'evidence')}\n源码引用: ${meta(n,'path')}\n跨边界关系（仅引用，不含邻居正文）:\n${boundary.map(x=>'- '+x).join('\n')||'- 无'}\n`;
      }).join('\n')+'\n证据正文和额外模块没有自动展开；需要时再按需获取。\n这里只预览模型片段，正式 CLI 尚未实现。';
    }
    function openPacket(){showDrawer('本次返回内容',`<span class="status">仅预览模拟成功返回项</span><p class="explanation">候选清单和未选模块正文不会进入这份预览。祖先只保留定位标题，跨模块关系只列边界引用。</p><pre class="packet">${esc(packetText())}</pre>`);}
    function openRecords(){
      const list=provided(), groups=[];
      if(list.length){groups.push({time:'示例 14:32',title:'模拟 CLI 成功返回 3 项',ids:mainIds.filter(id=>byId.has(id))});if(scenario==='expanded')groups.push({time:'示例 14:35',title:'按需追加 1 项',ids:[addedId].filter(id=>byId.has(id))});}
      showDrawer('上下文提供记录',`<span class="status">任务 demo-cancel-download · 模拟会话</span><p class="explanation">这些是交互设计示例，不是实际 agent 日志。</p><h3>成功提供</h3>${groups.length?groups.map(g=>`<div class="record"><small>${g.time}</small><strong>${g.title}</strong><ul>${g.ids.map(id=>`<li>${esc(byId.get(id).title)}</li>`).join('')}</ul><small>模型 ${revision()}${scenario==='stale'?' · 演示旧快照':''}</small></div>`).join(''):'<p class="empty-records">暂无成功记录。候选和失败请求不会计入已提供。</p>'}<h3>其他读取操作</h3><p class="explanation">此设计稿未接入真实工具日志，覆盖未知。正式产品将单独列出受支持的读取证据，不将其补算成 CLI 提供记录。</p><button class="block-button" id="recordsPacket">查看返回内容预览</button><a class="source-link" href="/">查看现有原型的实际工具日志 ↗</a>`);
      $('recordsPacket').addEventListener('click',openPacket);
    }
    $('recordsButton').addEventListener('click',()=>snapshot&&openRecords());
    $('packetButton').addEventListener('click',()=>snapshot&&openPacket());
    $('scenario').addEventListener('change',event=>{scenario=event.target.value;render();});
    $('nextScenario').addEventListener('click',()=>{scenario=scenarios[Math.min(scenarios.length-1,scenarios.indexOf(scenario)+1)];$('scenario').value=scenario;render();});
    $('drawerShade').addEventListener('click',event=>{if(event.target===$('drawerShade'))closeDrawer();});
    document.addEventListener('keydown',event=>{
      if($('drawerShade').hidden)return;
      if(event.key==='Escape'){event.preventDefault();closeDrawer();}
      if(event.key==='Tab'){
        const all=[...$('drawer').querySelectorAll('button,a[href],select,[tabindex="0"]')].filter(el=>!el.disabled),first=all[0],last=all.at(-1);
        if(event.shiftKey&&(document.activeElement===first||document.activeElement===$('drawer'))){event.preventDefault();last?.focus();}
        else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}
      }
    });
    async function init(){
      try{
        const response=await fetch('/api/snapshot');if(!response.ok)throw new Error(`HTTP ${response.status}`);
        snapshot=await response.json();nodes=snapshot.elements??[];byId=new Map(nodes.map(n=>[n.id,n]));
        if(!byId.has('mgrp'))throw new Error('当前模型没有 MGRP 根对象');
        $('branchName').textContent=snapshot.sourceVersion?.branch??'main';
        $('sourceScope').textContent='已绑定来源工作区';
        $('sourceScope').title=snapshot.runtime?.sourceRoot??'未知';
        render();
      }catch(error){$('mapStage').innerHTML='<div class="loading">无法读取主模型。请确认本机原型服务正在运行。</div>';$('summary').textContent='模型未加载';$('sourceScope').textContent=error.message;}
    }
    init();
  </script>
</body>
</html>
